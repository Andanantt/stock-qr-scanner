<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Stock QR Scanner</title>

  <!-- QR Scanner Library -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #eef2f9;
      color: #16233f;
    }

    .container {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 24px;
    }

    .scanner {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #66738f;
      min-height: 22px;
    }

    .result {
      margin-top: 20px;
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .result-title {
      font-size: 14px;
      color: #66738f;
    }

    .vin {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
      word-break: break-all;
    }

  </style>
</head>


<body>

  <div class="container">

    <h1>Scan QR</h1>

    <div class="scanner">
      <div id="reader"></div>
    </div>

    <div class="status" id="status">
      กำลังเตรียมกล้อง...
    </div>

    <div class="result">

      <div class="result-title">
        VIN ที่อ่านได้
      </div>

      <div class="vin" id="vin">
        -
      </div>

    </div>

  </div>


  <script>

    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     */

    const APP_URL =
      "https://script.google.com/a/macros/tripetch-isuzu.co.th/s/AKfycbwAk2fjCXzX7p8bTXzV854Deh3kNoTZCiNK5WHmIFYHYrFJU_rDSwxX41kJrcBFuhrZ8Q/exec";


    let scanner = null;
    let scanCompleted = false;


    /*
     * =========================================================
     * START CAMERA
     * =========================================================
     */

    function startScanner() {

      scanner = new Html5Qrcode("reader");

      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      scanner.start(

        {
          facingMode: "environment"
        },

        config,


        function(decodedText) {

          if (scanCompleted) {
            return;
          }

          scanCompleted = true;

          const vin = decodedText.trim();

          console.log("QR scanned:", vin);

          document.getElementById("vin").textContent = vin;

          document.getElementById("status").textContent =
            "อ่าน QR สำเร็จ — กำลังค้นหาข้อมูลรถ...";


          /*
           * Stop camera first
           */

          stopScanner();


          /*
           * Build Apps Script URL
           *
           * Example:
           *
           * /exec?vin=MP1TFR41JTG032628
           */

          const targetUrl =
            APP_URL +
            "?vin=" +
            encodeURIComponent(vin);


          console.log("Redirect to:", targetUrl);


          /*
           * Go back to Stock Checking App
           */

          setTimeout(function() {

            window.location.href = targetUrl;

          }, 500);

        },


        function(errorMessage) {

          // QR not detected yet.
          // Do not display this repeatedly.

        }

      )


      .then(function() {

        document.getElementById("status").textContent =
          "กล้องพร้อมใช้งาน — เล็งไปที่ QR";

      })


      .catch(function(error) {

        console.error(
          "Camera start failed:",
          error
        );

        document.getElementById("status").textContent =
          "เปิดกล้องไม่สำเร็จ";

      });

    }


    /*
     * =========================================================
     * STOP CAMERA
     * =========================================================
     */

    function stopScanner() {

      if (!scanner) {
        return;
      }

      scanner
        .stop()
        .then(function() {

          scanner.clear();

        })
        .catch(function(error) {

          console.error(
            "Scanner stop error:",
            error
          );

        });

    }


    /*
     * =========================================================
     * START WHEN PAGE LOADS
     * =========================================================
     */

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>

</html>
